[project]
name = "qq-bot"
version = "0.1.0"
description = "Offline QQ LangGraph calculator agent"
readme = "README.md"
authors = [
    { name = "nepgear", email = "471198414@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.6.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.scripts]
qq-bot = "qq_bot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
